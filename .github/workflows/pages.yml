name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check_site.py"
      - "scripts/embed_rights.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Check every referenced image, model and video exists
        run: python3 scripts/check_site.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Embed rights metadata in any untagged image or model (lossless, verified)
        run: |
          pip install --quiet pillow
          python scripts/embed_rights.py
          python scripts/embed_rights.py --check

      - name: Keep editing notes out of the published site
        run: rm -f docs/deck/CLAUDE.md docs/deck/README.md

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
